name: Sürüm

# "v0.1.0" gibi bir etiket gönderildiğinde Windows, Linux ve macOS paketlerini üretip GitHub Sürümüne yükler.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paket:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            hedef: --win
          - os: ubuntu-latest
            hedef: --linux
          - os: macos-latest
            hedef: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @officehere/desktop dist -- ${{ matrix.hedef }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: officehere-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
          if-no-files-found: ignore

  yayin:
    needs: paket
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paketler
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: paketler/*
          generate_release_notes: true
