name: Sürüm

# "v0.1.0" gibi bir etiket gönderildiğinde ya da elle "surum" girişiyle tetiklendiğinde
# Windows, Linux ve macOS paketlerini üretip GitHub Sürümüne yükler. Elle tetiklemede
# etiket, çalışılan commit üzerinde GitHub tarafından oluşturulur.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      surum:
        description: "Sürüm etiketi (ör. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  paket:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            hedef: --win
          - os: ubuntu-latest
            hedef: --linux
          - os: macos-latest
            hedef: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @officehere/desktop dist -- ${{ matrix.hedef }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: officehere-${{ matrix.os }}
          # latest*.yml ve .blockmap dosyaları uygulama içi güncelleyici (electron-updater) içindir.
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: ignore

  yayin:
    needs: paket
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.surum, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sürüm notları docs/surumler/<etiket>.md dosyasından; yoksa GitHub otomatik üretir.
      - id: notlar
        shell: bash
        env:
          SURUM: ${{ inputs.surum || github.ref_name }}
        run: |
          if [ -f "docs/surumler/${SURUM}.md" ]; then echo "yol=docs/surumler/${SURUM}.md" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          path: paketler
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.surum || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: OfficeHere ${{ inputs.surum || github.ref_name }}
          files: paketler/*
          body_path: ${{ steps.notlar.outputs.yol }}
          generate_release_notes: ${{ steps.notlar.outputs.yol == '' }}
