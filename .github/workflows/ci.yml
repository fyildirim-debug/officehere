name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  denetim:
    name: Tip denetimi, test, derleme, uçtan uca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Yerel ayarsız toUpperCase/toLowerCase ve waitForTimeout sayaçları: artış = hata
      - run: pnpm denetim
      - run: pnpm typecheck
      - run: pnpm test
      # Süreye bağlı performans testleri ayrı ve sıralı adımda (makine hızına göre normalize)
      - run: pnpm test:perf
      - run: pnpm web
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: officehere-web
          path: dist-web
          retention-days: 7

  masaustu:
    name: Masaüstü (Electron) uçtan uca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node apps/desktop/node_modules/electron/install.js
      - run: pnpm web
      - run: pnpm --filter @officehere/desktop build:electron
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm e2e:masaustu
