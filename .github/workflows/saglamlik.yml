name: Sağlamlık

# Gerçek dünya derlemi kaydet-aç turu (pnpm derlem; test-derlem/poi: Apache POI'den gerçek Office dosyaları),
# kaydedilen paketlerin tutarlılık denetimi (pnpm derlem:opc), şema doğrulaması (pnpm derlem:xsd: ECMA-376
# Transitional XSD + ODF 1.3 RelaxNG), bozuk dosya bulanık testi (pnpm bulanik) ve kaydedilen dosyaların
# LibreOffice ile açılması (pnpm derlem:lo). Sonuçlar scripts/derlem/temel.json ile karşılaştırılır:
#   - yeni takılma / yığın taşması / bellek taşması: her zaman HATA
#   - POI derleminde uygulama başına parça kaybı artışı ya da açılamayan dosya, yeni paket (OPC/ODF) hatası,
#     izin listesi (scripts/derlem/xsd-izin.json) dışında yeni ya da artan şema hatası: her zaman HATA
#   - yeni kayıp, yeniden açılamayan dosya, kararsızlaşma, LibreOffice'in açamadığı çıktı: temel.json'daki
#     "kip" alanına göre HATA ("siki") ya da yalnız rapor ("baslangic"; elle tetiklemede değiştirilebilir)
#   - iyileşme: başarısız olmaz; `pnpm derlem:temel` ile temel güncellenir (artefaktta temel-aday.json var)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      kip:
        description: "Karşılaştırma kipi (temel: temel.json'daki kip)"
        required: false
        default: temel
        type: choice
        options: [temel, baslangic, siki]

permissions:
  contents: read

concurrency:
  group: saglamlik-${{ github.ref }}
  cancel-in-progress: true

jobs:
  saglamlik:
    name: Derlem turu, bulanık test, LibreOffice denetimi
    # Sabit imaj: LibreOffice sürümü üretilen derlemi ve piksel temel çizgisini belirler. ubuntu-latest 26.04'e
    # geçince gelen LibreOffice ODF 1.4 yazıyor ve farklı çiziyor; geçiş yeni temel çizgiyle ayrıca yapılır.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DERLEM_KIP: ${{ inputs.kip != 'temel' && inputs.kip || '' }}
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # python3-lxml: şema doğrulaması (xsd.py) ve onun betik testleri; jing'in istediği java runner'da hazır.
      - name: LibreOffice, PDF ve XML araçları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress python3-uno python3-lxml \
            poppler-utils fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
          soffice --version
          java -version
      - name: Araçların kendi testleri (karşılaştırma kuralları, envanter, MCE)
        run: pnpm test:betikler
      # ECMA-376 şemaları depoya konmaz (yeniden dağıtım koşulu belirsiz): Ecma'dan indirilir, SHA-256 betikte
      # sabit. ODF 1.3 RelaxNG (OASIS) ve jing (BSD) de aynı yolla. Anahtar sabit SHA'lardan; değişince yenilenir.
      - name: Şema önbelleği anahtarı
        id: sema
        run: echo "anahtar=$(python3 scripts/derlem/xsd.py --anahtar)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .sema-onbellek
          key: ${{ steps.sema.outputs.anahtar }}
      - name: Şemalar ve jing (önbellekte yoksa indir)
        run: python3 scripts/derlem/xsd.py --indir
      # Depodaki alt küme (test-derlem/) dışındaki büyük dosyalar ve LibreOffice formül sonuçları
      - name: Derlemi üret (pnpm derlem:uret)
        run: pnpm derlem:uret
      # Bulanık örnekler deterministiktir; tohumlar ve üretici değişmedikçe önbellekten gelir.
      - uses: actions/cache@v6
        with:
          path: .derlem/bulanik
          key: bulanik-${{ hashFiles('scripts/bulanik/uret.mjs', 'test-derlem/**', 'apps/belge/src/io/__fixtures__/bicimler/ornek.md', 'apps/tablo/test/fixtures/openpyxl/karmasik.xlsx', 'pnpm-lock.yaml') }}
      - name: Kaydet-aç turu (pnpm derlem)
        run: pnpm derlem
      - name: Paket tutarlılık denetimi (pnpm derlem:opc)
        if: ${{ !cancelled() }}
        run: pnpm derlem:opc
      # pnpm derlem:xsd ile aynı; --odf-zorunlu: java/jing yoksa ODF sessizce atlanmaz, adım düşer.
      - name: Şema doğrulaması (XSD + ODF RelaxNG)
        if: ${{ !cancelled() }}
        run: python3 scripts/derlem/xsd.py --odf-zorunlu
      - name: Bulanık test (pnpm bulanik)
        if: ${{ !cancelled() }}
        run: pnpm bulanik
      - name: LibreOffice denetimi (pnpm derlem:lo)
        if: ${{ !cancelled() }}
        run: pnpm derlem:lo
      - name: Özet ve aday temel çizgi
        if: ${{ !cancelled() }}
        run: |
          for f in derlem opc xsd bulanik lo_pdf; do
            if [ -f ".derlem/rapor/$f.md" ]; then head -c 300000 ".derlem/rapor/$f.md" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
          node scripts/derlem/temel.mjs --aday .derlem/rapor/temel-aday.json || true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: saglamlik-rapor
          path: |
            .derlem/rapor
            .derlem/cikti
          retention-days: 14

  # PDF/A (pnpm derlem:pdfa): derlemdeki belgeler masaüstü uygulamasında (Electron) açılıp kullanıcı yolundan
  # PDF/A-2b olarak dışa aktarılır ve veraPDF ile doğrulanır; saydamlıksız şablon PDF/A-1b, sayfa aralığı,
  # yer imi = başlık sayısı ve pdftotext ile Türkçe harfler de denetlenir. veraPDF (GPLv3+/MPLv2+) yalnız bu
  # işte, ayrı süreç olarak çalışır; pakete girmez. Sürüm ve SHA-256 betikte sabit (scripts/derlem/verapdf.mjs).
  pdfa:
    name: PDF/A (veraPDF)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node apps/desktop/node_modules/electron/install.js
      - name: PDF araçları ve yazı tipleri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
          pnpm exec playwright install-deps chromium
          java -version
      - uses: actions/cache@v6
        with:
          path: .derlem/verapdf
          key: verapdf-${{ hashFiles('scripts/derlem/verapdf.mjs') }}
      - name: veraPDF (önbellekte yoksa indir ve kur)
        run: node scripts/derlem/verapdf.mjs --kur --yalniz-kur
      - run: pnpm web
      - run: pnpm --filter @officehere/desktop build:electron
      - name: PDF/A turu (pnpm derlem:pdfa)
        run: xvfb-run -a pnpm derlem:pdfa
      - name: Özet
        if: ${{ !cancelled() }}
        run: if [ -f .derlem/rapor/pdfa.md ]; then cat .derlem/rapor/pdfa.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pdfa-rapor
          path: |
            .derlem/rapor/pdfa.*
            .derlem/pdfa
          retention-days: 14
