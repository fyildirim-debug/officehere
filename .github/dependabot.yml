# Bağımlılık güncellemeleri: npm haftalık (küçük/yama sürümleri tek PR'da gruplanır), GitHub Actions aylık.
# Ana sürüm yükseltmeleri ayrı PR olarak gelir (kırıcı değişiklik incelemesi için). Yeni bağımlılığın
# lisansı derlemede denetlenir (scripts/lisans-bildirimi.mjs, HUKUKI.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Bağımlılık"
    groups:
      uretim:
        dependency-type: production
        update-types: [minor, patch]
      gelistirme:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Istanbul
    commit-message:
      prefix: "CI"
    groups:
      eylemler:
        patterns: ["*"]
