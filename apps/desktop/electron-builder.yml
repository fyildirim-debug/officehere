# OfficeHere masaüstü paketleme yapılandırması (electron-builder).
appId: com.officehere.suite
productName: OfficeHere
copyright: Copyright © 2026 Furkan YILDIRIM
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - "!dist-electron/launcher/**"
  - package.json

asar: true

# Sürümler GitHub'a yüklenir (CI'da --publish never ile yalnız paket üretilir).
publish:
  provider: github
  owner: fyildirim-debug
  repo: officehere
  releaseType: release

# Web uygulamaları kaynak dizinine kopyalanır; ana süreç resources/apps/<uygulama> altından yükler.
extraResources:
  - from: ../belge/dist
    to: apps/belge
  - from: ../tablo/dist
    to: apps/tablo
  - from: ../sunum/dist
    to: apps/sunum
  - from: dist-electron/launcher
    to: apps/baslangic
  - from: build/icon.png
    to: icon.png
  # OfficeHere lisansı; üçüncü taraf bildirimleri her uygulamanın THIRD_PARTY_NOTICES.txt dosyasındadır.
  - from: ../../LICENSE
    to: LICENSE.txt

fileAssociations:
  - ext: docx
    name: OfficeHere.Belge
    description: Belge
    role: Editor
    icon: filetypes/belge
    mimeType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - ext: xlsx
    name: OfficeHere.Tablo
    description: Çalışma Kitabı
    role: Editor
    icon: filetypes/tablo
    mimeType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  - ext: csv
    name: OfficeHere.CSV
    description: Virgülle Ayrılmış Değerler
    role: Editor
    icon: filetypes/tablo
    mimeType: text/csv
  - ext: pptx
    name: OfficeHere.Sunum
    description: Sunu
    role: Editor
    icon: filetypes/sunum
    mimeType: application/vnd.openxmlformats-officedocument.presentationml.presentation
  - ext: doc
    name: OfficeHere.Belge97
    description: Belge (97-2003)
    role: Editor
    icon: filetypes/belge
    mimeType: application/msword
  - ext: odt
    name: OfficeHere.ODT
    description: OpenDocument Metin
    role: Editor
    icon: filetypes/belge
    mimeType: application/vnd.oasis.opendocument.text
  - ext: rtf
    name: OfficeHere.RTF
    description: Zengin Metin Belgesi
    role: Editor
    icon: filetypes/belge
    mimeType: application/rtf
  - ext: xls
    name: OfficeHere.Tablo97
    description: Çalışma Kitabı (97-2003)
    role: Editor
    icon: filetypes/tablo
    mimeType: application/vnd.ms-excel
  - ext: ods
    name: OfficeHere.ODS
    description: OpenDocument Hesap Tablosu
    role: Editor
    icon: filetypes/tablo
    mimeType: application/vnd.oasis.opendocument.spreadsheet
  - ext: tsv
    name: OfficeHere.TSV
    description: Sekmeyle Ayrılmış Değerler
    role: Editor
    icon: filetypes/tablo
    mimeType: text/tab-separated-values
  - ext: ppt
    name: OfficeHere.Sunum97
    description: Sunu (97-2003)
    role: Editor
    icon: filetypes/sunum
    mimeType: application/vnd.ms-powerpoint
  - ext: ppsx
    name: OfficeHere.Gosteri
    description: Slayt Gösterisi
    role: Editor
    icon: filetypes/sunum
    mimeType: application/vnd.openxmlformats-officedocument.presentationml.slideshow
  - ext: odp
    name: OfficeHere.ODP
    description: OpenDocument Sunu
    role: Editor
    icon: filetypes/sunum
    mimeType: application/vnd.oasis.opendocument.presentation

win:
  icon: icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  # Atlama listesi görevlerinin simgeleri (src/main/tasks.ts): resources/filetypes/<uygulama>.ico
  extraResources:
    - from: build/filetypes
      to: filetypes
      filter: ["*.ico"]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OfficeHere
  license: ../../LICENSE
  installerLanguages: [tr_TR, en_US]
  language: "1055"
  multiLanguageInstaller: true

portable:
  artifactName: ${productName}-${version}-tasinabilir.${ext}

linux:
  icon: icons
  executableName: officehere
  category: Office
  synopsis: Açık kaynak ofis paketi
  target:
    - AppImage
    - deb

deb:
  depends: ["libnss3", "libgtk-3-0", "libxss1", "libasound2t64 | libasound2"]
  # Masaüstü girdisinin sağ tık eylemleri (Windows atlama listesinin karşılığı; src/main/tasks.ts).
  desktop:
    entry:
      Actions: yeni-belge;yeni-tablo;yeni-sunu;
    desktopActions:
      yeni-belge:
        Name: Yeni Belge
        Exec: /opt/OfficeHere/officehere --yeni=belge
      yeni-tablo:
        Name: Yeni Tablo
        Exec: /opt/OfficeHere/officehere --yeni=tablo
      yeni-sunu:
        Name: Yeni Sunu
        Exec: /opt/OfficeHere/officehere --yeni=sunum

mac:
  icon: icon.icns
  category: public.app-category.productivity
  target: dmg
